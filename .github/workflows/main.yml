name: Fork CI smoke test

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'pramodk/STAT'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture and Docker
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          docker version
          test "$(docker run --rm --platform "${{ matrix.platform }}" ubuntu:24.04 uname -m)" = "${{ matrix.arch }}"
